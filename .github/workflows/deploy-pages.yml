# Auto-deploy on push to main.
# This Pages project is Direct Upload (no native Git connection), so CI uses Wrangler.
#
# Required GitHub repo secrets:
#   CLOUDFLARE_API_TOKEN   — Account token with Cloudflare Pages Edit
#   CLOUDFLARE_ACCOUNT_ID  — d6c425e806e0ff076764e27791c50479
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_ANON_KEY
#   VITE_SUPABASE_FUNCTIONS_URL
#   VITE_EMAIL_ENABLED     — "true" or "false"
#   VITE_PAYMENT_PROVIDER  — e.g. "stub"

name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_FUNCTIONS_URL: ${{ secrets.VITE_SUPABASE_FUNCTIONS_URL }}
          VITE_EMAIL_ENABLED: ${{ secrets.VITE_EMAIL_ENABLED }}
          VITE_PAYMENT_PROVIDER: ${{ secrets.VITE_PAYMENT_PROVIDER }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=cuddlepost --branch=main
